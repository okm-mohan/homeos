services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-manpro}
      POSTGRES_USER: ${POSTGRES_USER:-manpro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U $${POSTGRES_USER}]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
  mosquitto:
    image: eclipse-mosquitto:2
    ports: ["1883:1883"]
    volumes: [./infrastructure/mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro]
  api:
    build: ./services/api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://manpro:change-me@postgres:5432/manpro}
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
  web:
    build: ./apps/web
    environment: [NEXT_PUBLIC_API_URL=http://localhost:8000]
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  postgres_data:
